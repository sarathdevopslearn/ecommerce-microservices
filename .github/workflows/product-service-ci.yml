
name: Product Service CI

on:
  push:
    branches:
      - master
    paths:
      - "services/product-service/**"
      - ".github/workflows/product-service-ci.yml"
      - ".github/workflows/product-service-cd.yml"
      - "k8s/product-deployment.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "services/product-service/**"
      - ".github/workflows/product-service-ci.yml"
      - ".github/workflows/product-service-cd.yml"
      - "k8s/product-deployment.yaml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Product Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/product-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/product-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -v

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}
