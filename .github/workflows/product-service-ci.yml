name: Product Service CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test-product-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/product-service

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: |
          PYTHONPATH=. pytest

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t product-service:2.0 .

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag product-service:2.0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:2.0

      # 8. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:2.0
