
name: Order Service CI-CD

on:
  push:
    branches:
      - master
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"
      - "k8s/order-service-config.yaml"
      - "k8s/order-service-deployment.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"
      - "k8s/order-service-config.yaml"
      - "k8s/order-service-deployment.yaml"

jobs:

  # =========================
  # CI - TEST AND BUILD
  # =========================

  ci:
    name: Test and Build Order Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/order-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/order-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}

  # =========================
  # CD - DEPLOY THROUGH AWS SSM
  # =========================

  cd:
    name: Deploy Order Service through AWS SSM
    needs: ci
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # DEBUG OIDC CLAIMS
      # =========================

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          TOKEN="$TOKEN" python3 - <<'PY'
          import os
          import json
          import base64

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub")
          }, indent=2))
          PY

      # =========================
      # CONFIGURE AWS OIDC
      # =========================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # =========================
      # DEPLOY ORDER SERVICE
      # =========================

      - name: Deploy Order Service using SSM
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}
          INSTANCE_ID: i-097558d787632b3cd
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_B64=$(base64 -w0 k8s/order-service-config.yaml)
          DEPLOYMENT_B64=$(base64 -w0 k8s/order-service-deployment.yaml)

          PARAMETERS=$(jq -n \
            --arg config "$CONFIG_B64" \
            --arg deployment "$DEPLOYMENT_B64" \
            --arg image "$IMAGE" \
            '{
              commands: [
                "set -e",
                "mkdir -p /tmp/ecommerce-k8s",
                ("printf '\''%s'\'' '\''" + $config + "'\'' | base64 -d > /tmp/ecommerce-k8s/order-service-config.yaml"),
                ("printf '\''%s'\'' '\''" + $deployment + "'\'' | base64 -d > /tmp/ecommerce-k8s/order-service-deployment.yaml"),
                "KUBECTL=\"sudo /usr/local/bin/k3s kubectl\"",
                "$KUBECTL apply -f /tmp/ecommerce-k8s/order-service-config.yaml",
                ("sed -i '\''s|^[[:space:]]*image:.*|          image: " + $image + "|'\'' /tmp/ecommerce-k8s/order-service-deployment.yaml"),
                "$KUBECTL apply -f /tmp/ecommerce-k8s/order-service-deployment.yaml",
                "if ! $KUBECTL rollout status deployment/order-service -n ecommerce --timeout=180s; then echo '\''Deployment failed. Rolling back.'\''; $KUBECTL rollout undo deployment/order-service -n ecommerce; exit 1; fi",
                "$KUBECTL get deployment order-service -n ecommerce",
                "$KUBECTL get pods -n ecommerce -o wide"
              ]
            }')

          echo "Sending deployment command to EC2 through SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Order Service from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in

              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;

            esac

            sleep 5
          done

          echo "SSM deployment timed out."
          exit 1
