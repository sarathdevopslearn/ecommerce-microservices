
name: Order Service CI-CD

on:
  push:
    branches:
      - master
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"
      - "k8s/order-service-config.yaml"
      - "k8s/order-service-deployment.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"
      - "k8s/order-service-config.yaml"
      - "k8s/order-service-deployment.yaml"

jobs:
  # =========================
  # CI - TEST AND BUILD
  # =========================
  ci:
    name: Test and Build Order Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/order-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/order-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}

  # =========================
  # CD - DEPLOY TO K3S
  # =========================
  cd:
    name: Deploy Order Service to K3s
    needs: ci
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /tmp/ecommerce-k8s

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/order-service-config.yaml,k8s/order-service-deployment.yaml"
          target: "/tmp/ecommerce-k8s"
          strip_components: 1
          overwrite: true

      - name: Deploy Order Service
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            KUBECTL="sudo /usr/local/bin/k3s kubectl"

            echo "Applying Order Service ConfigMap"

            $KUBECTL apply \
              -f /tmp/ecommerce-k8s/order-service-config.yaml

            echo "Updating Deployment manifest image"

            sed -i "s|^\([[:space:]]*image:\).*|\1 $IMAGE|" \
              /tmp/ecommerce-k8s/order-service-deployment.yaml

            echo "Applying updated Deployment"

            $KUBECTL apply \
              -f /tmp/ecommerce-k8s/order-service-deployment.yaml

            echo "Waiting for rollout"

            if ! $KUBECTL rollout status \
              deployment/order-service \
              -n ecommerce --timeout=180s; then

              echo "Deployment failed. Rolling back..."

              $KUBECTL rollout undo \
                deployment/order-service \
                -n ecommerce

              exit 1
            fi

            echo "Order Service deployed successfully"

            $KUBECTL get deployment order-service -n ecommerce

            $KUBECTL get pods -n ecommerce -o wide
