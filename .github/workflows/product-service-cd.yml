
name: Product Service CD

on:
  workflow_run:
    workflows:
      - Product Service CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-product-service:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /tmp/ecommerce-k8s

      - name: Copy Kubernetes manifest to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/product-deployment.yaml"
          target: "/tmp/ecommerce-k8s"
          strip_components: 1
          overwrite: true

      - name: Deploy Product Service
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -eu

            KUBECTL="sudo /usr/local/bin/k3s kubectl"
            MANIFEST="/tmp/ecommerce-k8s/product-deployment.yaml"

            echo "Deploying Product Service"
            echo "Image: $IMAGE"

            echo "Updating Deployment manifest"

            sed -i "s|^\([[:space:]]*image:\).*|\1 $IMAGE|" "$MANIFEST"

            echo "Applying Kubernetes Deployment"

            $KUBECTL apply -f "$MANIFEST"

            echo "Waiting for rollout"

            if ! $KUBECTL rollout status \
              deployment/product-service \
              -n ecommerce \
              --timeout=180s; then

              echo "Deployment failed. Rolling back."

              $KUBECTL rollout undo \
                deployment/product-service \
                -n ecommerce

              exit 1
            fi

            echo "Verifying Product Service"

            $KUBECTL get deployment product-service -n ecommerce

            $KUBECTL get pods -n ecommerce \
              -l app=product-service

            $KUBECTL get endpoints product-service -n ecommerce

            echo "Product Service deployment completed."
