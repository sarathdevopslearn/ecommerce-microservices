
name: Product Service CD

on:
  workflow_run:
    workflows:
      - Product Service CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy-product-service:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # =========================
      # CONFIGURE AWS OIDC
      # =========================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # =========================
      # DEPLOY THROUGH AWS SSM
      # =========================

      - name: Deploy Product Service using SSM
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.event.workflow_run.head_sha }}
          INSTANCE_ID: i-097558d787632b3cd

        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_B64=$(base64 -w0 k8s/product-deployment.yaml)

          PARAMETERS=$(jq -n \
            --arg deployment "$DEPLOYMENT_B64" \
            --arg image "$IMAGE" \
            '{
              commands: [
                "set -e",
                "mkdir -p /tmp/ecommerce-k8s",
                ("printf '\''%s'\'' '\''" + $deployment + "'\'' | base64 -d > /tmp/ecommerce-k8s/product-deployment.yaml"),
                "KUBECTL=\"sudo /usr/local/bin/k3s kubectl\"",
                ("sed -i '\''s|^[[:space:]]*image:.*|          image: " + $image + "|'\'' /tmp/ecommerce-k8s/product-deployment.yaml"),
                "$KUBECTL apply -f /tmp/ecommerce-k8s/product-deployment.yaml",
                "if ! $KUBECTL rollout status deployment/product-service -n ecommerce --timeout=180s; then echo '\''Deployment failed. Rolling back.'\''; $KUBECTL rollout undo deployment/product-service -n ecommerce; exit 1; fi",
                "$KUBECTL get deployment product-service -n ecommerce",
                "$KUBECTL get pods -n ecommerce -l app=product-service",
                "$KUBECTL get endpoints product-service -n ecommerce"
              ]
            }')

          echo "Sending Product Service deployment to EC2 through SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Product Service from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in

              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;

            esac

            sleep 5
          done

          echo "SSM deployment timed out."
          exit 1
