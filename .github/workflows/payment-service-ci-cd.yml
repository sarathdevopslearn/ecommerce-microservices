name: Payment Service CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'services/payment-service/**'
      - '.github/workflows/payment-service-ci-cd.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'services/payment-service/**'
      - '.github/workflows/payment-service-ci-cd.yml'

  workflow_dispatch:

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/payment-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:1.0 .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:1.0

  deploy:
    needs: test-build-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Payment Service to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:1.0

            docker stop payment-service || true
            docker rm payment-service || true

            docker run -d \
              --name payment-service \
              --restart unless-stopped \
              -p 5006:5006 \
              ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:1.0

            sleep 5
            docker ps --filter name=payment-service
            curl --fail http://localhost:5006/health