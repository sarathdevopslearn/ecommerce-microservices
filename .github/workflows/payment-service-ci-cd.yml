
name: Payment Service CI-CD

on:
  push:
    branches:
      - master
    paths:
      - "services/payment-service/**"
      - ".github/workflows/payment-service-ci-cd.yml"
      - "k8s/payment-service-deployment.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "services/payment-service/**"
      - ".github/workflows/payment-service-ci-cd.yml"
      - "k8s/payment-service-deployment.yaml"

  workflow_dispatch:

jobs:

  # =========================
  # CI - TEST AND BUILD
  # =========================

  ci:
    name: Test and Build Payment Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/payment-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Login to Docker Hub
        if: >-
          (github.event_name == 'push' &&
          github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: >-
          (github.event_name == 'push' &&
          github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master')
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }} .

      - name: Push Docker image
        if: >-
          (github.event_name == 'push' &&
          github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master')
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }}

  # =========================
  # CD - DEPLOY THROUGH AWS SSM
  # =========================

  cd:
    name: Deploy Payment Service through AWS SSM
    needs: ci
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # CONFIGURE AWS OIDC
      # =========================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # =========================
      # DEPLOY PAYMENT SERVICE
      # =========================

      - name: Deploy Payment Service using SSM
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }}
          INSTANCE_ID: i-097558d787632b3cd

        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_B64=$(base64 -w0 k8s/payment-service-deployment.yaml)

          PARAMETERS=$(jq -n \
            --arg deployment "$DEPLOYMENT_B64" \
            --arg image "$IMAGE" \
            '{
              commands: [
                "set -e",
                "mkdir -p /tmp/ecommerce-k8s",
                ("printf '\''%s'\'' '\''" + $deployment + "'\'' | base64 -d > /tmp/ecommerce-k8s/payment-service-deployment.yaml"),
                "KUBECTL=\"sudo /usr/local/bin/k3s kubectl\"",
                ("sed -i '\''s|^[[:space:]]*image:.*|          image: " + $image + "|'\'' /tmp/ecommerce-k8s/payment-service-deployment.yaml"),
                "$KUBECTL apply -f /tmp/ecommerce-k8s/payment-service-deployment.yaml",
                "if ! $KUBECTL rollout status deployment/payment-service -n ecommerce --timeout=180s; then echo '\''Deployment failed. Rolling back.'\''; $KUBECTL rollout undo deployment/payment-service -n ecommerce; exit 1; fi",
                "$KUBECTL get deployment payment-service -n ecommerce",
                "$KUBECTL get pods -n ecommerce -l app=payment-service",
                "$KUBECTL get endpoints payment-service -n ecommerce"
              ]
            }')

          echo "Sending Payment Service deployment to EC2 through SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Payment Service from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in

              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;

            esac

            sleep 5
          done

          echo "SSM deployment timed out."
          exit 1
