
name: Notification Service CI-CD

on:
  push:
    branches:
      - master
    paths:
      - "services/notification-service/**"
      - ".github/workflows/notification-service-ci-cd.yml"
      - "k8s/notification-service-deployment.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "services/notification-service/**"
      - ".github/workflows/notification-service-ci-cd.yml"
      - "k8s/notification-service-deployment.yaml"

  workflow_dispatch:

jobs:
  ci:
    name: Test and Build Notification Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/notification-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Login to Docker Hub
        if: >-
          (github.event_name == 'push' &&
          github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: >-
          (github.event_name == 'push' &&
          github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master')
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }} .

      - name: Push Docker image
        if: >-
          (github.event_name == 'push' &&
          github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master')
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}

  cd:
    name: Deploy Notification Service to K3s
    needs: ci
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /tmp/ecommerce-k8s

      - name: Copy Kubernetes manifest to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/notification-service-deployment.yaml"
          target: "/tmp/ecommerce-k8s/"
          strip_components: 1

      - name: Apply Notification Service deployment
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            KUBECTL="sudo /usr/local/bin/k3s kubectl"
            MANIFEST="/tmp/ecommerce-k8s/notification-service-deployment.yaml"

            echo "Deploying Notification Service"
            echo "Image: $IMAGE"

            $KUBECTL get deployment notification-service -n ecommerce

            sed -i "s|^\([[:space:]]*image:\).*|\1 $IMAGE|" "$MANIFEST"

            $KUBECTL apply -f "$MANIFEST"

            if ! $KUBECTL rollout status deployment/notification-service \
              -n ecommerce --timeout=180s; then

              echo "Deployment failed. Rolling back..."

              $KUBECTL rollout undo deployment/notification-service \
                -n ecommerce

              exit 1
            fi

            echo "Notification Service deployment successful"

            $KUBECTL get deployment notification-service -n ecommerce
            $KUBECTL get pods -n ecommerce -o wide
            $KUBECTL get endpoints notification-service -n ecommerce
