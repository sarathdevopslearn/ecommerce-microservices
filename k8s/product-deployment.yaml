
apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: sarathdevopslearn/product-service:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
